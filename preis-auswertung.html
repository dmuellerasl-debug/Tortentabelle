<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Preis-Detailansicht</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --ink: #2c1a1a;
      --berry: #7c2e2e;
      --rose: #e45757;
      --mint: #d9f0df;
      --paper: rgba(255, 255, 255, 0.78);
      --line: rgba(124, 46, 46, 0.18);
      --shadow: 0 18px 48px rgba(90, 33, 33, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Manrope", sans-serif;
      color: var(--ink);
      min-height: 100vh;
      background:
        radial-gradient(circle at 10% 12%, rgba(255, 199, 142, 0.5), transparent 34%),
        radial-gradient(circle at 92% 78%, rgba(217, 240, 223, 0.75), transparent 35%),
        linear-gradient(135deg, #ffefdb, #f8fff9);
    }

    .shell {
      max-width: 980px;
      margin: 0 auto;
      padding: 1.1rem;
    }

    .card {
      border-radius: 22px;
      border: 1px solid rgba(255, 255, 255, 0.58);
      background: var(--paper);
      backdrop-filter: blur(9px);
      box-shadow: var(--shadow);
      padding: 1rem;
    }

    h1 {
      margin: 0;
      color: var(--berry);
      font-family: "Fraunces", serif;
      font-size: clamp(1.55rem, 5vw, 2.55rem);
      line-height: 1.05;
    }

    .sub {
      margin: 0.25rem 0 0;
      opacity: 0.85;
    }

    .row {
      display: grid;
      gap: 0.75rem;
      grid-template-columns: 1fr;
      margin-top: 0.85rem;
    }

    @media (min-width: 760px) {
      .row {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        align-items: end;
      }
    }

    label {
      display: block;
      margin-bottom: 0.35rem;
      color: var(--berry);
      font-size: 0.92rem;
      font-weight: 700;
    }

    input,
    button {
      width: 100%;
      padding: 0.62rem 0.72rem;
      border-radius: 12px;
      border: 1px solid var(--line);
      font: inherit;
    }

    button {
      cursor: pointer;
      font-weight: 700;
      transition: transform 0.15s ease, box-shadow 0.2s ease;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 20px rgba(124, 46, 46, 0.17);
    }

    .btn-primary {
      border: 0;
      color: #fff;
      background: linear-gradient(120deg, var(--rose), #c63f3f);
    }

    .btn-soft {
      background: #fff;
      color: var(--berry);
    }

    .table-wrap {
      margin-top: 1rem;
      overflow-x: auto;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.82);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 640px;
    }

    th,
    td {
      text-align: left;
      padding: 0.65rem 0.72rem;
      border-bottom: 1px solid rgba(124, 46, 46, 0.12);
      vertical-align: top;
    }

    th {
      color: var(--berry);
      font-size: 0.88rem;
      letter-spacing: 0.02em;
    }

    td:last-child,
    th:last-child {
      text-align: right;
      white-space: nowrap;
    }

    .total {
      margin-top: 0.9rem;
      border-radius: 12px;
      border: 1px solid rgba(24, 121, 78, 0.28);
      background: rgba(24, 121, 78, 0.12);
      padding: 0.7rem 0.8rem;
      font-weight: 800;
      color: #14603e;
      display: flex;
      justify-content: space-between;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    .status {
      margin-top: 0.8rem;
      padding: 0.58rem 0.72rem;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(124, 46, 46, 0.08);
      font-size: 0.9rem;
    }

    .status.warn {
      color: #9b431d;
      border-color: rgba(155, 67, 29, 0.34);
      background: rgba(155, 67, 29, 0.1);
    }

    .status.ok {
      color: #14603e;
      border-color: rgba(24, 121, 78, 0.28);
      background: rgba(24, 121, 78, 0.12);
    }

    .auth {
      margin-top: 0.95rem;
      display: grid;
      gap: 0.75rem;
      grid-template-columns: 1fr;
    }

    @media (min-width: 760px) {
      .auth {
        grid-template-columns: 1fr 1fr auto;
        align-items: end;
      }
    }

    .d-none {
      display: none !important;
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="card">
      <h1>Preis-Detailansicht</h1>
      <p class="sub">Auswertung nach Zeitraum auf Basis von due_to. Leere due_to werden als aktueller Zeitpunkt behandelt.</p>

      <div id="loginBox" class="auth">
        <div>
          <label for="email">E-Mail</label>
          <input id="email" type="email" autocomplete="username" placeholder="dein.name@mail.de" />
        </div>
        <div>
          <label for="password">Passwort</label>
          <input id="password" type="password" autocomplete="current-password" placeholder="Passwort" />
        </div>
        <div>
          <button id="loginBtn" class="btn-primary" type="button">Einloggen</button>
        </div>
      </div>

      <div id="appBox" class="d-none">
        <div class="row">
          <div>
            <label for="von">Von</label>
            <input id="von" type="datetime-local" />
          </div>
          <div>
            <label for="bis">Bis</label>
            <input id="bis" type="datetime-local" />
          </div>
          <div>
            <button id="yearBtn" class="btn-soft" type="button">Aktuelles Jahr</button>
          </div>
          <div>
            <button id="applyBtn" class="btn-primary" type="button">Berechnen</button>
          </div>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Tortenname</th>
                <th>Für wen</th>
                <th>Preis</th>
              </tr>
            </thead>
            <tbody id="rows">
              <tr><td colspan="3">Noch keine Daten geladen.</td></tr>
            </tbody>
          </table>
        </div>

        <div class="total">
          <span>Gesamtpreis</span>
          <span id="gesamt">0,00 €</span>
        </div>

        <div style="margin-top:0.8rem; display:flex; gap:0.5rem; flex-wrap:wrap;">
          <button id="reloadBtn" class="btn-soft" type="button">Neu laden</button>
          <button id="logoutBtn" class="btn-soft" type="button">Logout</button>
        </div>
      </div>

      <div id="status" class="status">Bereit.</div>
    </section>
  </main>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    const SUPABASE_URL = "https://cwojlvvavtneuhgicoia.supabase.co";
    const SUPABASE_KEY = "sb_publishable_2bC6ZttBRVp3jhbIhRKYfA_5wPxZL7c";
    const TABLE = "Torten";

    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    const loginBox = document.getElementById("loginBox");
    const appBox = document.getElementById("appBox");
    const statusBox = document.getElementById("status");
    const rowsBody = document.getElementById("rows");
    const gesamtEl = document.getElementById("gesamt");

    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const loginBtn = document.getElementById("loginBtn");
    const reloadBtn = document.getElementById("reloadBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const applyBtn = document.getElementById("applyBtn");
    const yearBtn = document.getElementById("yearBtn");

    const vonInput = document.getElementById("von");
    const bisInput = document.getElementById("bis");

    let rootRows = [];

    function setStatus(text, type = "") {
      statusBox.textContent = text;
      statusBox.classList.remove("ok", "warn");
      if (type) statusBox.classList.add(type);
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function toDatetimeLocal(date) {
      const d = date instanceof Date ? date : new Date(date);
      if (Number.isNaN(d.getTime())) return "";
      const pad = (n) => String(n).padStart(2, "0");
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    function getCurrentYearRange() {
      const now = new Date();
      const y = now.getFullYear();
      return {
        von: new Date(y, 0, 1, 0, 0, 0, 0),
        bis: new Date(y, 11, 31, 23, 59, 59, 999)
      };
    }

    function setCurrentYearDefault() {
      const range = getCurrentYearRange();
      vonInput.value = toDatetimeLocal(range.von);
      bisInput.value = toDatetimeLocal(range.bis);
    }

    function euro(value) {
      const n = Number(value);
      const safe = Number.isFinite(n) ? n : 0;
      return `${safe.toLocaleString("de-DE", { minimumFractionDigits: 2, maximumFractionDigits: 2 })} €`;
    }

    function resolveDue(row) {
      if (!row || !row.due_to) {
        return new Date();
      }
      const d = new Date(row.due_to);
      return Number.isNaN(d.getTime()) ? new Date() : d;
    }

    function readRange() {
      const vonDate = new Date(vonInput.value);
      const bisDate = new Date(bisInput.value);
      const now = new Date();

      const von = Number.isNaN(vonDate.getTime()) ? new Date(now.getFullYear(), 0, 1, 0, 0, 0, 0) : vonDate;
      const bis = Number.isNaN(bisDate.getTime()) ? new Date(now.getFullYear(), 11, 31, 23, 59, 59, 999) : bisDate;

      if (von > bis) {
        return { von: bis, bis: von };
      }
      return { von, bis };
    }

    function render(rows) {
      if (!rows.length) {
        rowsBody.innerHTML = "<tr><td colspan='3'>Keine Treffer im Zeitraum.</td></tr>";
        gesamtEl.textContent = euro(0);
        return;
      }

      rowsBody.innerHTML = rows
        .map((row) => `
          <tr>
            <td>${escapeHtml(row.name || "Ohne Name")}</td>
            <td>${escapeHtml(row.fuer_wen || "-")}</td>
            <td>${euro(row.price_wert)}</td>
          </tr>
        `)
        .join("");

      const sum = rows.reduce((acc, row) => acc + (Number.isFinite(Number(row.price_wert)) ? Number(row.price_wert) : 0), 0);
      gesamtEl.textContent = euro(sum);
    }

    function applyRange() {
      const { von, bis } = readRange();
      const filtered = rootRows.filter((row) => {
        const due = resolveDue(row);
        return due >= von && due <= bis;
      });

      render(filtered);
      setStatus(`Treffer: ${filtered.length} | Zeitraum: ${toDatetimeLocal(von)} bis ${toDatetimeLocal(bis)}`, "ok");
    }

    async function loadData() {
      setStatus("Lade Torten...", "");
      const { data, error } = await supabase
        .from(TABLE)
        .select("id, name, fuer_wen, price_wert, due_to, stockwerk, zu_tortenID")
        .order("created_at", { ascending: false });

      if (error) {
        setStatus(`Fehler beim Laden: ${error.message}`, "warn");
        return;
      }

      const rows = Array.isArray(data) ? data : [];
      rootRows = rows.filter((row) => {
        const stockwerk = Number(row.stockwerk ?? 1);
        const parent = row.zu_tortenID ?? null;
        return stockwerk === 1 && parent === null;
      });

      applyRange();
    }

    async function showAppIfSession() {
      const { data, error } = await supabase.auth.getSession();
      if (error) {
        setStatus(`Session-Fehler: ${error.message}`, "warn");
        return;
      }

      if (data.session) {
        loginBox.classList.add("d-none");
        appBox.classList.remove("d-none");
        setCurrentYearDefault();
        await loadData();
      } else {
        loginBox.classList.remove("d-none");
        appBox.classList.add("d-none");
        setStatus("Bitte einloggen.", "");
      }
    }

    loginBtn.addEventListener("click", async () => {
      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        setStatus("Bitte E-Mail und Passwort eingeben.", "warn");
        return;
      }

      setStatus("Anmeldung laeuft...", "");
      const { error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) {
        setStatus(`Login fehlgeschlagen: ${error.message}`, "warn");
        return;
      }

      loginBox.classList.add("d-none");
      appBox.classList.remove("d-none");
      setCurrentYearDefault();
      await loadData();
    });

    reloadBtn.addEventListener("click", loadData);
    applyBtn.addEventListener("click", applyRange);
    yearBtn.addEventListener("click", () => {
      setCurrentYearDefault();
      applyRange();
    });

    vonInput.addEventListener("change", applyRange);
    bisInput.addEventListener("change", applyRange);

    logoutBtn.addEventListener("click", async () => {
      await supabase.auth.signOut();
      rowsBody.innerHTML = "<tr><td colspan='3'>Noch keine Daten geladen.</td></tr>";
      gesamtEl.textContent = euro(0);
      loginBox.classList.remove("d-none");
      appBox.classList.add("d-none");
      setStatus("Abgemeldet.", "");
    });

    showAppIfSession();
  </script>
</body>
</html>
